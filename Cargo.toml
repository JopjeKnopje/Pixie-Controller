[package]
name = "pixie-controller"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cli"
path = "src/cli/main.rs"

[[bin]]
name = "controller"
path = "src/controller/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = "4.6.9"
env_logger = "0.11.12"
human-panic = "2.0.8"
interprocess = "2.4.10"
ka3005p = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
serialport = "4.10.1"
